[project]
name = "gpu-stacker"
version = "1.2.0"
description = "GPU (CUDA) stacker for FITS lights from any telescope (colour or mono) or Siril-registered sequences: registration, drizzle, Siril-equivalent rejection stacking, with a desktop UI."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD-PARTY-NOTICES.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:CUDA path could not be detected:UserWarning"]
